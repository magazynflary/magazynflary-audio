repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: .hooks/uv-lock.sh
        language: unsupported_script
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: .hooks/ruff-check.sh
        language: unsupported_script
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .hooks/ruff-format.sh
        language: unsupported_script
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: .hooks/mypy.sh
        language: unsupported_script
        types_or: [python, pyi]
        pass_filenames: false
